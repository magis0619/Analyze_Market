name: Delvers
options:
  bundleIdPrefix: com.delvers
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  DelversCore:
    path: ../swift

targets:
  Delvers:
    type: application
    platform: iOS
    sources: [Delvers]
    dependencies:
      - package: DelversCore
        product: DelversCore
    info:
      path: Delvers/Info.plist
      properties:
        CFBundleDisplayName: DELVERS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.delvers.app
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  DelversUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DelversUITests]
    dependencies:
      - target: Delvers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.delvers.uitests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Delvers

schemes:
  Delvers:
    build:
      targets:
        Delvers: all
        DelversUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [DelversUITests]
