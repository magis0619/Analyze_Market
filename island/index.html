<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>島歩き</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a1826; overflow: hidden; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; width: 100%; height: 100%; }

    #hud {
      position: absolute; left: 12px; bottom: 12px; z-index: 10;
      font: 12px/1.7 -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #eaf4ff; text-shadow: 0 1px 3px rgba(0, 20, 40, .75);
      background: rgba(6, 24, 40, .32); backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, .16); border-radius: 10px;
      padding: 10px 12px; min-width: 190px;
    }
    #hud.hidden { display: none; }
    #hud label { display: flex; align-items: center; gap: 8px; }
    #hud .name { width: 3.2em; opacity: .82; }
    #hud .val { width: 3.6em; text-align: right; font-variant-numeric: tabular-nums; opacity: .82; }
    #hud input[type=range] { flex: 1; accent-color: #46d6d0; height: 16px; }
    #hud .views { display: flex; gap: 6px; margin-top: 8px; }
    #hud button {
      flex: 1; font: inherit; color: inherit; cursor: pointer;
      background: rgba(255, 255, 255, .10); border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 6px; padding: 4px 0;
    }
    #hud button:hover { background: rgba(255, 255, 255, .2); }
    #hud .help { margin-top: 8px; opacity: .6; font-size: 11px; line-height: 1.5; }
    #boot {
      position: absolute; inset: 0; display: grid; place-items: center; z-index: 20;
      font: 13px -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #cfe6ff; background: #0a1826; transition: opacity .6s;
    }
    #boot.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="boot">島をつくっています…</div>
  <div id="hud">
    <label><span class="name">時刻</span><input id="time" type="range" min="0" max="24" step="0.05" value="11.5" /><span class="val" id="timeval">11:30</span></label>
    <label><span class="name">天候</span><input id="weather" type="range" min="0" max="1" step="0.01" value="0" /><span class="val" id="weatherval">快晴</span></label>
    <div class="views">
      <button data-view="beach">砂浜</button>
      <button data-view="overlook">岬</button>
      <button data-view="shallows">波打ち際</button>
    </div>
    <div class="help">WASD / ドラッグで歩く・見回す<br>H でこのパネルを隠す</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
