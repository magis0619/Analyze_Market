name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/game-creation-bcoyzz
      - claude/beach-image-matching-lu3qo3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run island:build
      # 島歩きは DELVERS とは別アプリなので /island/ 配下にまとめて置く
      - run: mkdir -p dist/island && cp -r dist-island/. dist/island/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
